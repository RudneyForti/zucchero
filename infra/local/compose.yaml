services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: confeitaria
      POSTGRES_USER: confeitaria_admin
      POSTGRES_PASSWORD: confeitaria_admin
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confeitaria_admin -d confeitaria"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - confeitaria_postgres:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - confeitaria_redis:/data

volumes:
  confeitaria_postgres:
  confeitaria_redis:
